minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade

peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

shellEmulator: true

audit:
  ignore: []
  ignorePrune: true

overrides:
  # tinypool 2.1.0 has two critical advisories, and oxfmt 0.35.0 pins it. Remove this once eslint-plugin-format allows oxfmt 0.68.0 or later.
  tinypool: 2.1.2
